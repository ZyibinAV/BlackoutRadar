spring:
  application:
    name: BlackoutRadar

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

blackoutradar:
  notification:
    email:
      from: ${MAIL_FROM:blackoutradar@localhost}
      subject: ${MAIL_SUBJECT:BlackoutRadar power outage notification}
    retry:
      poll-interval: ${RETRY_POLL_INTERVAL:30s}
    recovery:
      poll-interval: ${RECOVERY_POLL_INTERVAL:5m}
      stuck-threshold: ${RECOVERY_STUCK_THRESHOLD:15m}
  security:
    jwt:
      issuer: ${JWT_ISSUER:blackoutradar}
      audience: ${JWT_AUDIENCE:blackoutradar-api}
      access-token-lifetime: ${JWT_ACCESS_TOKEN_LIFETIME:15m}
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
    refresh-token:
      lifetime: ${REFRESH_TOKEN_LIFETIME:30d}


