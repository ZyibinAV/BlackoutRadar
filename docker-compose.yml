name: blackoutradar

services:
  postgres:
    image: postgres:18
    container_name: blackoutradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - blackoutradar-postgres-data:/var/lib/postgresql
    networks:
      - blackoutradar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  blackoutradar-postgres-data:
    name: blackoutradar-postgres-data

networks:
  blackoutradar-network:
    name: blackoutradar-network
    driver: bridge
